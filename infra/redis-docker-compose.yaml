# generated using Google Gemini

services:
  # Redis Cluster requires a minimum of 3 master nodes. 
  # Using alpine images to minimize resource footprint.
  redis-node-1:
    image: redis:7.2-alpine
    container_name: redis-node-1
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "cmVkaXNwYXNzd29yZA", "--masterauth", "cmVkaXNwYXNzd29yZA"]
    ports:
      - "6371:6379"
      - "16371:16379"
    volumes:
      - redis-node-1-data:/data
    networks:
      - redis-cluster-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cmVkaXNwYXNzd29yZA", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  redis-node-2:
    image: redis:7.2-alpine
    container_name: redis-node-2
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "cmVkaXNwYXNzd29yZA", "--masterauth", "cmVkaXNwYXNzd29yZA"]
    ports:
      - "6372:6379"
      - "16372:16379"
    volumes:
      - redis-node-2-data:/data
    networks:
      - redis-cluster-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cmVkaXNwYXNzd29yZA", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  redis-node-3:
    image: redis:7.2-alpine
    container_name: redis-node-3
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "cmVkaXNwYXNzd29yZA", "--masterauth", "cmVkaXNwYXNzd29yZA"]
    ports:
      - "6373:6379"
      - "16373:16379"
    volumes:
      - redis-node-3-data:/data
    networks:
      - redis-cluster-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cmVkaXNwYXNzd29yZA", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # Helper service to initialize the cluster once nodes are up
  redis-cluster-creator:
    image: redis:7.2-alpine
    container_name: redis-cluster-creator
    networks:
      - redis-cluster-net
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    entrypoint: >
      sh -c "sleep 5 && 
      redis-cli -a cmVkaXNwYXNzd29yZA --cluster create 
      redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 
      --cluster-replicas 0 --cluster-yes"

networks:
  redis-cluster-net:
    driver: bridge

volumes:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:

# FIXME : secrets/passwords must not be checked-in to version control

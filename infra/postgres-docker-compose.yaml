# generated using Google Gemini

services:
  postgres:
    image: postgres:16-alpine
    container_name: bms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bmsuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bmsdb
    volumes:
      # Persist database data
      - bms-pgdata:/var/lib/postgresql/data
      # Mount schema.sql to initialize the database
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmsuser -d bmsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bms-pgdata:
